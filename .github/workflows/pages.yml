name: Deploy (GitHub Pages + Cloudflare Pages)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependências de desenvolvimento
        run: npm ci

      - name: Testes
        run: npm test

      - name: Browser para o teste de acessibilidade
        run: npx playwright install --with-deps chromium

      - name: Teste de acessibilidade (axe, WCAG 2.1 AA)
        run: npm run test:a11y

      - name: Preparar site
        run: |
          mkdir _site
          # Copia tudo para o site publicado, exceto ficheiros de desenvolvimento
          # (testes, configuração do projeto, workflows, git). Isto evita que uma
          # nova pasta de calculadora fique esquecida na lista e dê 404 em produção.
          shopt -s extglob
          cp -r !(_site|tests|scripts|node_modules|.git|.github|package.json|package-lock.json|README.md) _site/

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Período de transição: o mesmo site é também publicado no Cloudflare Pages.
  # Usa o artefacto já preparado pelo job "build", por isso os dois destinos
  # recebem exatamente os mesmos ficheiros. Falhas aqui não afetam o GitHub Pages.
  deploy-cloudflare:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: ${{ steps.deployment.outputs.deployment-url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'mariacf' }}
    steps:
      - name: Verificar configuração do Cloudflare
        id: config
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Segredos CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID em falta; publicação no Cloudflare Pages ignorada."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.config.outputs.ok == 'true'
        with:
          name: github-pages

      - name: Extrair site
        if: steps.config.outputs.ok == 'true'
        run: |
          mkdir _site
          tar -xf artifact.tar -C _site

      - id: deployment
        if: steps.config.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }} --branch=main
