name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Testes
        run: npm test

      - name: Preparar site
        run: |
          mkdir _site
          # Copia tudo para o site publicado, exceto ficheiros de desenvolvimento
          # (testes, configuração do projeto, workflows, git). Isto evita que uma
          # nova pasta de calculadora fique esquecida na lista e dê 404 em produção.
          shopt -s extglob
          cp -r !(_site|tests|node_modules|.git|.github|package.json|package-lock.json|README.md) _site/

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
